name: Release

run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer, z. B. 0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version muss wie 0.2.0 aussehen"
            exit 1
          fi

      - name: Set release variables
        shell: bash
        run: |
          set -euo pipefail
          echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          echo "FULL_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          echo "VERSION_SLUG=${{ inputs.version }}" >> "$GITHUB_ENV"
          echo "TAG=v${{ inputs.version }}" >> "$GITHUB_ENV"
          echo "DIST_DIR=dist/${{ inputs.version }}" >> "$GITHUB_ENV"

      - name: Update pv2hash/version.py
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]

          content = (
              f'APP_VERSION = "{version}"\n'
              'APP_VERSION_FULL = APP_VERSION\n'
          )

          Path("pv2hash/version.py").write_text(content, encoding="utf-8")
          PY

      - name: Check tag does not exist
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG existiert bereits"
            exit 1
          fi

      - name: Commit version file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pv2hash/version.py
          git commit -m "Release $FULL_VERSION"

      - name: Create tag
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "PV2Hash $FULL_VERSION"

      - name: Push commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Push tag
        shell: bash
        run: |
          set -euo pipefail
          git push origin "$TAG"

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_release.sh
          bash scripts/build_release.sh

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DIST_DIR/pv2hash-$VERSION_SLUG.tar.gz"
          test -f "$DIST_DIR/manifest.json"
          test -f "$DIST_DIR/SHA256SUMS"

          cd "$DIST_DIR"
          sha256sum -c SHA256SUMS

      - name: Prepare public installer asset
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install_release.sh "$DIST_DIR/install.sh"
          bash -n "$DIST_DIR/install.sh"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$DIST_DIR/pv2hash-$VERSION_SLUG.tar.gz" \
            "$DIST_DIR/manifest.json" \
            "$DIST_DIR/SHA256SUMS" \
            "$DIST_DIR/install.sh" \
            --title "PV2Hash $FULL_VERSION" \
            --notes "Release $FULL_VERSION" \
            --latest

      - name: Validate get.pv2hash.xyz deployment secrets
        if: ${{ inputs.version == '0.8.0' }}
        shell: bash
        env:
          GET_SSH_HOST: ${{ secrets.GET_SSH_HOST }}
          GET_SSH_PORT: ${{ secrets.GET_SSH_PORT }}
          GET_SSH_USER: ${{ secrets.GET_SSH_USER }}
          GET_SSH_KEY: ${{ secrets.GET_SSH_KEY }}
          GET_REMOTE_PATH: ${{ secrets.GET_REMOTE_PATH }}
          GET_BASE_URL: ${{ secrets.GET_BASE_URL }}
        run: |
          set -euo pipefail

          test -n "$GET_SSH_HOST" || (echo "Missing secret: GET_SSH_HOST" && exit 1)
          test -n "$GET_SSH_PORT" || (echo "Missing secret: GET_SSH_PORT" && exit 1)
          test -n "$GET_SSH_USER" || (echo "Missing secret: GET_SSH_USER" && exit 1)
          test -n "$GET_SSH_KEY" || (echo "Missing secret: GET_SSH_KEY" && exit 1)
          test -n "$GET_REMOTE_PATH" || (echo "Missing secret: GET_REMOTE_PATH" && exit 1)
          test -n "$GET_BASE_URL" || (echo "Missing secret: GET_BASE_URL" && exit 1)

      - name: Create stable channel manifest
        if: ${{ inputs.version == '0.8.0' }}
        shell: bash
        env:
          GET_BASE_URL: ${{ secrets.GET_BASE_URL }}
        run: |
          set -euo pipefail

          ARTIFACT="pv2hash-${VERSION_SLUG}.tar.gz"
          SHA256="$(cd "$DIST_DIR" && sha256sum "$ARTIFACT" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c%s "$DIST_DIR/$ARTIFACT")"
          RELEASE_URL="${GET_BASE_URL}/releases/${TAG}/${ARTIFACT}"
          RELEASED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          mkdir -p dist/channel

          cat > dist/channel/stable.json <<EOF
          {
            "channel": "stable",
            "updates_enabled": true,
            "latest": {
              "version": "${VERSION}",
              "version_full": "${TAG}",
              "released_at": "${RELEASED_AT}",
              "asset": {
                "name": "${ARTIFACT}",
                "url": "${RELEASE_URL}",
                "sha256": "${SHA256}",
                "size_bytes": ${SIZE_BYTES}
              },
              "manifest_url": "${GET_BASE_URL}/releases/${TAG}/manifest.json",
              "checksums_url": "${GET_BASE_URL}/releases/${TAG}/SHA256SUMS",
              "requires_restart": true
            }
          }
          EOF

          cat dist/channel/stable.json

      - name: Install SSH key for get.pv2hash.xyz
        if: ${{ inputs.version == '0.8.0' }}
        shell: bash
        env:
          GET_SSH_HOST: ${{ secrets.GET_SSH_HOST }}
          GET_SSH_PORT: ${{ secrets.GET_SSH_PORT }}
          GET_SSH_KEY: ${{ secrets.GET_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$GET_SSH_KEY" > ~/.ssh/get_deploy_key
          chmod 600 ~/.ssh/get_deploy_key

          ssh-keyscan -p "$GET_SSH_PORT" "$GET_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload release artifacts to get.pv2hash.xyz
        if: ${{ inputs.version == '0.8.0' }}
        shell: bash
        env:
          GET_SSH_HOST: ${{ secrets.GET_SSH_HOST }}
          GET_SSH_PORT: ${{ secrets.GET_SSH_PORT }}
          GET_SSH_USER: ${{ secrets.GET_SSH_USER }}
          GET_REMOTE_PATH: ${{ secrets.GET_REMOTE_PATH }}
        run: |
          set -euo pipefail

          SSH_CMD="ssh -i ~/.ssh/get_deploy_key -p ${GET_SSH_PORT}"
          REMOTE="${GET_SSH_USER}@${GET_SSH_HOST}"
          REMOTE_PATH="${GET_REMOTE_PATH}"

          ${SSH_CMD} "${REMOTE}" \
            "mkdir -p '${REMOTE_PATH}/releases/${TAG}' '${REMOTE_PATH}/channels'"

          rsync -avz \
            -e "${SSH_CMD}" \
            "$DIST_DIR/pv2hash-$VERSION_SLUG.tar.gz" \
            "$DIST_DIR/manifest.json" \
            "$DIST_DIR/SHA256SUMS" \
            "${REMOTE}:${REMOTE_PATH}/releases/${TAG}/"

      - name: Publish stable channel atomically
        if: ${{ inputs.version == '0.8.0' }}
        shell: bash
        env:
          GET_SSH_HOST: ${{ secrets.GET_SSH_HOST }}
          GET_SSH_PORT: ${{ secrets.GET_SSH_PORT }}
          GET_SSH_USER: ${{ secrets.GET_SSH_USER }}
          GET_REMOTE_PATH: ${{ secrets.GET_REMOTE_PATH }}
        run: |
          set -euo pipefail

          SSH_CMD="ssh -i ~/.ssh/get_deploy_key -p ${GET_SSH_PORT}"
          REMOTE="${GET_SSH_USER}@${GET_SSH_HOST}"
          REMOTE_PATH="${GET_REMOTE_PATH}"

          rsync -avz \
            -e "${SSH_CMD}" \
            "dist/channel/stable.json" \
            "${REMOTE}:${REMOTE_PATH}/channels/stable.json.tmp"

          ${SSH_CMD} "${REMOTE}" \
            "mv '${REMOTE_PATH}/channels/stable.json.tmp' '${REMOTE_PATH}/channels/stable.json'"
      - name: Publish installer script atomically
        if: ${{ inputs.version == '0.8.0' }}
        shell: bash
        env:
          GET_SSH_HOST: ${{ secrets.GET_SSH_HOST }}
          GET_SSH_PORT: ${{ secrets.GET_SSH_PORT }}
          GET_SSH_USER: ${{ secrets.GET_SSH_USER }}
          GET_REMOTE_PATH: ${{ secrets.GET_REMOTE_PATH }}
        run: |
          set -euo pipefail

          SSH_CMD="ssh -i ~/.ssh/get_deploy_key -p ${GET_SSH_PORT}"
          REMOTE="${GET_SSH_USER}@${GET_SSH_HOST}"
          REMOTE_PATH="${GET_REMOTE_PATH}"

          rsync -avz \
            -e "${SSH_CMD}" \
            "scripts/install_release.sh" \
            "${REMOTE}:${REMOTE_PATH}/install.sh.tmp"

          ${SSH_CMD} "${REMOTE}" \
            "mv '${REMOTE_PATH}/install.sh.tmp' '${REMOTE_PATH}/install.sh' && chmod 755 '${REMOTE_PATH}/install.sh'"

