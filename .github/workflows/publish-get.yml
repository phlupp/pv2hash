name: Publish PV2Hash distribution feed

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.7.1"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            RELEASE_TAG="${{ inputs.tag }}"
          elif [[ -n "${GITHUB_REF_NAME:-}" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            echo "Could not resolve release tag."
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DIST_DIR=dist/${VERSION}" >> "$GITHUB_ENV"

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/build_release.sh
          scripts/build_release.sh "${VERSION}"

          echo "Built artifacts:"
          find "dist/${VERSION}" -maxdepth 1 -type f -print | sort

      - name: Validate expected artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -f "dist/${VERSION}/pv2hash-${VERSION}.tar.gz"
          test -f "dist/${VERSION}/manifest.json"
          test -f "dist/${VERSION}/SHA256SUMS"

          cd "dist/${VERSION}"
          sha256sum -c SHA256SUMS

      - name: Create stable channel manifest
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="pv2hash-${VERSION}.tar.gz"
          SHA256="$(cd "dist/${VERSION}" && sha256sum "${ARTIFACT}" | awk '{print $1}')"
          SIZE_BYTES="$(stat -c%s "dist/${VERSION}/${ARTIFACT}")"
          RELEASE_URL="${{ secrets.GET_BASE_URL }}/releases/${RELEASE_TAG}/${ARTIFACT}"
          RELEASED_AT="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          mkdir -p "dist/channel"

          cat > "dist/channel/stable.json" <<EOF
          {
            "channel": "stable",
            "updates_enabled": true,
            "latest": {
              "version": "${VERSION}",
              "version_full": "${RELEASE_TAG}",
              "released_at": "${RELEASED_AT}",
              "asset": {
                "name": "${ARTIFACT}",
                "url": "${RELEASE_URL}",
                "sha256": "${SHA256}",
                "size_bytes": ${SIZE_BYTES}
              },
              "manifest_url": "${{ secrets.GET_BASE_URL }}/releases/${RELEASE_TAG}/manifest.json",
              "checksums_url": "${{ secrets.GET_BASE_URL }}/releases/${RELEASE_TAG}/SHA256SUMS",
              "requires_restart": true
            }
          }
          EOF

          cat "dist/channel/stable.json"

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "${{ secrets.GET_SSH_KEY }}" > ~/.ssh/get_deploy_key
          chmod 600 ~/.ssh/get_deploy_key

          ssh-keyscan -p "${{ secrets.GET_SSH_PORT }}" "${{ secrets.GET_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release artifacts
        shell: bash
        run: |
          set -euo pipefail

          SSH_CMD="ssh -i ~/.ssh/get_deploy_key -p ${{ secrets.GET_SSH_PORT }}"
          REMOTE="${{ secrets.GET_SSH_USER }}@${{ secrets.GET_SSH_HOST }}"
          REMOTE_PATH="${{ secrets.GET_REMOTE_PATH }}"

          ${SSH_CMD} "${REMOTE}" \
            "mkdir -p '${REMOTE_PATH}/releases/${RELEASE_TAG}' '${REMOTE_PATH}/channels'"

          rsync -avz \
            -e "${SSH_CMD}" \
            "dist/${VERSION}/pv2hash-${VERSION}.tar.gz" \
            "dist/${VERSION}/manifest.json" \
            "dist/${VERSION}/SHA256SUMS" \
            "${REMOTE}:${REMOTE_PATH}/releases/${RELEASE_TAG}/"

      - name: Publish stable channel atomically
        shell: bash
        run: |
          set -euo pipefail

          SSH_CMD="ssh -i ~/.ssh/get_deploy_key -p ${{ secrets.GET_SSH_PORT }}"
          REMOTE="${{ secrets.GET_SSH_USER }}@${{ secrets.GET_SSH_HOST }}"
          REMOTE_PATH="${{ secrets.GET_REMOTE_PATH }}"

          rsync -avz \
            -e "${SSH_CMD}" \
            "dist/channel/stable.json" \
            "${REMOTE}:${REMOTE_PATH}/channels/stable.json.tmp"

          ${SSH_CMD} "${REMOTE}" \
            "mv '${REMOTE_PATH}/channels/stable.json.tmp' '${REMOTE_PATH}/channels/stable.json'"

      - name: Publish install script placeholder
        shell: bash
        run: |
          set -euo pipefail

          cp scripts/install_release.sh dist/install.sh

          SSH_CMD="ssh -i ~/.ssh/get_deploy_key -p ${{ secrets.GET_SSH_PORT }}"
          REMOTE="${{ secrets.GET_SSH_USER }}@${{ secrets.GET_SSH_HOST }}"
          REMOTE_PATH="${{ secrets.GET_REMOTE_PATH }}"

          rsync -avz \
            -e "${SSH_CMD}" \
            "dist/install.sh" \
            "${REMOTE}:${REMOTE_PATH}/install.sh"

          ${SSH_CMD} "${REMOTE}" \
            "chmod 755 '${REMOTE_PATH}/install.sh'"
